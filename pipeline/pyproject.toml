[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terratempo"
version = "0.1.0"
description = "Terra Tempo pipeline: anomalies, trend tests and exports for NASA Earth system data"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pymannkendall>=1.4", "h5py>=3.10", "netCDF4>=1.6", "pyhdf>=0.11"]
# Only needed to read and download real NASA files.
nasa = ["h5py>=3.10", "netCDF4>=1.6", "pyhdf>=0.11", "earthaccess>=0.9"]

[tool.setuptools.packages.find]
include = ["terratempo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
terratempo = ["places.json"]
